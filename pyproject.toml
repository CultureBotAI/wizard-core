[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-core"
version = "0.2.0"
description = "Shared infrastructure for Claude-Code-driven document-generation wizards (slide-wizard, proposal-wizard, repo-research-writer)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "CultureBotAI" }]
keywords = ["claude-code", "document-generation", "workflow", "state-machine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# No runtime dependencies — content generation runs inside Claude Code,
# not via an SDK. Optional extras pull in libraries for specific
# capabilities.
dependencies = []

[project.optional-dependencies]
google = [
    # Drive / Slides / Docs access via the CultureBotAI service account
    "google-auth>=2.20",
    "google-api-python-client>=2.100",
]
literature = [
    "requests>=2.31",
    "requests-cache>=1.0",
]
parsers = [
    "python-docx>=1.1",
    "PyPDF2>=3.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
]
validation = [
    "jsonschema>=4.0",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[project.urls]
Homepage = "https://github.com/CultureBotAI/wizard-core"
Issues = "https://github.com/CultureBotAI/wizard-core/issues"

[tool.setuptools.packages.find]
include = ["wizard_core*"]
exclude = ["tests*"]
